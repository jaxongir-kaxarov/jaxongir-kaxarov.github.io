{% assign drive_id = include.id %} {% assign title = include.title %}

<p>
  <iframe
    class="embed-video googledrive"
    src="https://drive.google.com/file/d/{{ drive_id }}/preview"
    width="640"
    height="480"
    allow="autoplay; fullscreen"
    style="border: none"
  >
  </iframe>
  {% if title %}
  <em>{{ title }}</em>
  {% endif %}
</p>
